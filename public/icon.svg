<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041308"/>
      <stop offset="50%" stop-color="#082310"/>
      <stop offset="100%" stop-color="#144d24"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Pitch center circle & lines decoration -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="10 6"/>
  <line x1="24" y1="256" x2="488" y2="256" stroke="#22c55e" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Football Trophy / Ball Emblem -->
  <circle cx="256" cy="256" r="90" fill="#082310" stroke="url(#neonGlow)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Football Pentagons -->
  <polygon points="256,206 289,230 276,270 236,270 223,230" fill="#4ade80"/>
  <line x1="256" y1="206" x2="256" y2="170" stroke="#4ade80" stroke-width="4"/>
  <line x1="289" y1="230" x2="325" y2="215" stroke="#4ade80" stroke-width="4"/>
  <line x1="276" y1="270" x2="305" y2="300" stroke="#4ade80" stroke-width="4"/>
  <line x1="236" y1="270" x2="207" y2="300" stroke="#4ade80" stroke-width="4"/>
  <line x1="223" y1="230" x2="187" y2="215" stroke="#4ade80" stroke-width="4"/>
</svg>
